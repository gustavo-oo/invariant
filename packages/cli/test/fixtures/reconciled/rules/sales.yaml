capability: sales
rules:
  - id: SALES-004
    statement: "A sale MUST NOT complete when stock is insufficient."
    rationale: "Prevents overselling."
    criticality: critical
    status: enforced
    owners: [team-commerce]
    checks:
      - id: sales.rejects-insufficient-stock
        layer: integration
        negative_control:
          kind: seam
          seam: buildApp({ stockPolicy })
          sabotage: .invariant/sabotages/sales/stock.ts
  - id: SALES-005
    statement: "A sale MUST record its total."
    rationale: "Totals are auditable."
    criticality: normal
    status: draft
    checks:
      - id: sales.records-total
        layer: unit
